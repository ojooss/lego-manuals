name: Test

# Wiederverwendbarer Workflow: Abhängigkeiten installieren, Assets bauen,
# PHPStan und PHPUnit ausführen. Wird von docker-image.yml und
# composer-update.yml aufgerufen.

on:
  workflow_call:
    inputs:
      lockfiles-artifact:
        description: 'Name eines Artifacts mit aktualisierten Lock-Dateien (leer = Stand aus dem Repository)'
        type: string
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download updated lockfiles
        if: inputs.lockfiles-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.lockfiles-artifact }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, imagick, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install ghostscript and allow PDF reading in ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript
          sudo find /etc -type f -path "*ImageMagick*/policy.xml" -exec cp docker/ImageMagick-6-Policy.xml {} \;

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Npm install & build assets
        run: |
          npm ci
          npm run build

      - name: PHPStan
        run: composer phpstan

      - name: Migrations + fixtures smoke test
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction
          composer test
        env:
          DATABASE_URL: "sqlite:///%kernel.project_dir%/var/data_test.db"

      - name: Create test database
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: PHPUnit
        run: composer phpunit
