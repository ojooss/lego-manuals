name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:  # Enables manual triggering

jobs:

  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, imagick, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install ghostscript and allow PDF reading in ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript
          sudo find /etc -type f -path "*ImageMagick*/policy.xml" -exec cp docker/ImageMagick-6-Policy.xml {} \;

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Npm install & build assets
        run: |
          npm ci
          npm run build

      - name: Create test database
        run: |
          php bin/console doctrine:database:create --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: PHPUnit
        run: composer phpunit

  build:

    needs: test

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and push the Docker image
      - name: Build and push Docker image
        #run: docker buildx build --platform linux/amd64,linux/arm/v7 --tag ojooss/lema:latest --push .
        run: docker build --tag ojooss/lema:latest --push --file docker/Dockerfile .
