name: Composer Update

on:
  schedule:
    - cron: '0 4 * * 1'  # every Monday at 04:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, imagick, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install ghostscript and allow PDF reading in ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript
          sudo find /etc -type f -path "*ImageMagick*/policy.xml" -exec cp docker/ImageMagick-6-Policy.xml {} \;

      - name: Composer Update
        run: composer update --no-interaction --prefer-dist

      - name: PHPStan
        run: composer phpstan

      - name: Migrations + fixtures smoke test
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction
          composer test
        env:
          DATABASE_URL: "sqlite:///%kernel.project_dir%/var/data_test.db"

      - name: Npm install & build assets
        run: |
          npm ci
          npm run build

      - name: Create test database
        run: |
          php bin/console doctrine:database:create --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: PHPUnit
        run: composer phpunit

      - name: Commit updated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock package-lock.json
          git diff --staged --quiet && echo "Nothing to commit" || git commit -m "chore: composer update"
          git push

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ojooss/lema:latest
