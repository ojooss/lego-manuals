name: Composer Update

on:
  schedule:
    - cron: '0 4 * * 1'  # every Monday at 04:00 UTC
  workflow_dispatch:

jobs:

  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, imagick, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Der post-update-cmd Hook führt zusätzlich "npm update" aus
      - name: Composer Update
        run: composer update --no-interaction --prefer-dist

      - name: Upload updated lockfiles
        uses: actions/upload-artifact@v7
        with:
          name: lockfiles
          path: |
            composer.lock
            package-lock.json
            symfony.lock

  test:
    needs: update
    uses: ./.github/workflows/_test.yml
    with:
      lockfiles-artifact: lockfiles

  commit:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download updated lockfiles
        uses: actions/download-artifact@v8
        with:
          name: lockfiles

      - name: Commit updated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add composer.lock package-lock.json symfony.lock
          git diff --staged --quiet && echo "Nothing to commit" || git commit -m "chore: composer update"
          git push

  # Pushes mit dem GITHUB_TOKEN lösen keine weiteren Workflows aus, daher wird
  # das Image hier direkt gebaut (inklusive des soeben committeten Stands).
  build:
    needs: commit
    uses: ./.github/workflows/_build-image.yml
    with:
      ref: master
    secrets: inherit
